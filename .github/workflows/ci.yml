# =============================================================================
# Lint, type-check, and test on every PR (and on master).
#
# This is the CLAUDE.md dev loop, enforced:
#     uv run ruff check .
#     uv run mypy src
#     uv run pytest -q
#
# Runs on pull_request so problems surface BEFORE merge — build-push.yml only
# triggers on push to master, which means a broken PR would otherwise sail
# through review and straight into an image build.
#
# No secrets and no tailnet access: everything here runs against the checkout.
# =============================================================================

name: ci

on:
  pull_request:
  # Called by build-push.yml so the image is only published if these pass.
  # Deliberately NOT triggered on push to master as well: build-push.yml
  # already invokes it there, and having both would run the whole suite twice
  # per merge. Mirrors hk47.
  workflow_call:

permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      # --locked fails if uv.lock is out of sync with pyproject.toml, so a
      # dependency change that skipped `uv lock` is caught here rather than
      # at image build time.
      - name: Install dependencies
        id: install
        run: uv sync --locked

      # Each check runs even if an earlier CHECK failed, so one run reports every
      # problem rather than just the first. Gated on the install succeeding —
      # without deps these would fail for an unrelated reason — and on the job not
      # being cancelled, which `always()` would wrongly ignore.
      - name: Lint (ruff)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      - name: Type-check (mypy --strict)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run mypy src

      - name: Tests (pytest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest -q
